<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms</title>
</head>
<body>
    <h2>My First Form</h2>
    <form>
        <div>
            <input type="radio" name="gender" value="male" id="fldMale" checked>
            <label for="fldMale">Man</label><br>
            <input type="radio" name="gender" value="female" id="fldFemale">
            <label for="fldFemale">Woman</label>
        </div>

        <div>
            <input type="checkbox" name="vehicle1" value="bike" id="fldBike" checked>
            <label for="fldBike">Bike</label><br>
            <input type="checkbox" name="vehicle2" id="fldMotorcycle">
            <label for="fldMotorcycle">Motorcycle</label><br>
            <input type="checkbox" name="vehicle3" value="car" id="fldCar">
            <label for="fldCar">Car</label><br>
        </div>

        <div>
            <label for="fldNationality"></label>
            <select name="nationality" id="fldNationality">
                <option value="default" disabled selected>Choose Nationality</option>
                <option value="greek">Greece</option>
                <option value="english">England</option>
                <option value="spanish">Spain</option>
            </select>
        </div>

        <div>
            <div>
                <label for="fldFirstname">Name</label>
                <input type="text" name="firstname" id="fldFirstname" placeholder="Submit your name" minlength="5" maxlength="15" required>
            </div>
            <div>
                <label for="">Years of experience</label>
                <input type="number" name="word-experience" id="fldWordExperience" min="3" max="20">
            </div>
            <div>
                <label for="fldEmail">Email</label>
                <input type="email" name="email" id="fldEmail">
            </div>

        </div>

    </form>
    
</body>
</html>
